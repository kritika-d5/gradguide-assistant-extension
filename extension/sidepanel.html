<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GradGuide Assist</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="header"></header>
  <div id="banner" role="status" aria-live="polite"></div>

  <section id="ask" aria-label="Suggested next question"></section>

  <section class="panel" aria-labelledby="profile-title">
    <div class="section-head">
      <h2 id="profile-title">Profile</h2>
      <div id="listen"></div>
    </div>
    <div id="profile"></div>
    <div id="notes"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-shortlist" aria-controls="shortlist" aria-selected="true">Shortlist</button>
    <button role="tab" id="tab-search" aria-controls="search" aria-selected="false">Search</button>
  </nav>

  <section id="shortlist" role="tabpanel" aria-labelledby="tab-shortlist"></section>
  <section id="search" role="tabpanel" aria-labelledby="tab-search" hidden></section>

  <footer id="footer"></footer>

  <script src="extract.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
